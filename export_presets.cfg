[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/*.txt"
exclude_filter="docs/*,verification/*,web/*,.github/*"
export_path=""
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.export-templates/windows_debug_x86_64.exe"
custom_template/release="res://.export-templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/modify_resources=false

[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/*.txt"
exclude_filter="docs/*,verification/*,web/*,.github/*"
export_path=""
script_export_mode=2

[preset.1.options]
custom_template/debug="res://.export-templates/web_nothreads_debug.zip"
custom_template/release="res://.export-templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
